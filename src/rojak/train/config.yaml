# Start with a known-good architecture. Muse Glimmer (30B, Apache 2.0) is the stronger story
# but is multimodal; confirm AutoModelForCausalLM loads it before spending credits:
#   base_model: meta-models/Muse-Glimmer-30B
base_model: meta-llama/Llama-3.1-8B-Instruct
max_seq_len: 1024
seed: 7
lora:
  r: 16
  alpha: 32
  dropout: 0.05
train:
  epochs: 2
  batch_size: 8
  grad_accum: 2
  learning_rate: 0.0002
