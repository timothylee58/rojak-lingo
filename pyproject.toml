[project]
name = "rojak-lingo"
version = "0.1.0"
description = "Benchmark and fine-tune for Malaysian code-switched language"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "sacrebleu>=2.4",
  "scikit-learn>=1.5",
  "typer>=0.12",
  "tenacity>=8.3",
]

[project.optional-dependencies]
train = ["modal>=0.64", "transformers", "peft", "trl", "datasets", "wandb"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rojak"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
